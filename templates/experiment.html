var button = document.querySelector('.js-button');
var index = 1;
var numMessages = $('.hidemsg').length;
$('.hidemsg').hide();
toggler();
button.addEventListener('click', toggler);
function toggler() {
    $('.hidemsg').hide();   
    $('#msg' + index).show();

      if (button.innerText === "View Task") { 

      button.innerText = "View Teammate"; 
    
  }   
  else {  
    button.innerText= "View Task";    
  }
    index = (index + 1 <= numMessages) ? index + 1 : 1;
}




</script>
